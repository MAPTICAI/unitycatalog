name: unitycatalog

services:

  server:
    image: unitycatalog/unitycatalog:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # Reach host's port-forward (e.g. MinIO at localhost:9001) from inside the container
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./etc/conf
        target: /opt/unitycatalog/etc/conf
      - type: volume
        source: unitycatalog_data
        target: /opt/unitycatalog/etc/data
  ui:
    build:
      context: ui/
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  # Persist docker volume across container restarts
  unitycatalog_data:
