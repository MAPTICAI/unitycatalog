name: Build and Push Docker Images - unitycatalog

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - feature/minio-customization
    paths:
      - build/**
      - project/**
      - examples/**
      - server/**
      - api/**
      - clients/**
      - version.sbt
      - build.sbt
      - Dockerfile
  pull_request:
    branches:
      - main
    paths:
      - build/**
      - project/**
      - examples/**
      - server/**
      - api/**
      - clients/**
      - version.sbt
      - build.sbt
      - Dockerfile
  workflow_dispatch: {}

jobs:
  docker-cli-test:
    name: Docker CLI Sanity Check
    if: false  # Disabled to prevent supply chain attacks; remove this line to restore
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build Docker Image
        run: docker build -t unitycatalog-test:local .

      - name: Start Container
        run: docker run -d --name unitycatalog-test-container unitycatalog-test:local

      - name: Wait for Container to be Ready
        run: sleep 5

      - name: Test CLI Command
        run: docker exec unitycatalog-test-container ./bin/uc --help

      - name: Cleanup
        if: always()
        run: |
          docker stop unitycatalog-test-container || true
          docker rm unitycatalog-test-container || true

  build-and-push:
    needs: docker-cli-test
    if: false  # Disabled to prevent supply chain attacks; remove this line to restore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set registry owner (lowercase for ghcr.io)
        run: echo "REGISTRY_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Generate Metadata and Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ env.REGISTRY_OWNER }}/unitycatalog
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/minio-customization' }},prefix={{branch}}-

      - name: Login to GitHub Container Registry
        if: ${{ contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/minio-customization') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: ${{ contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/minio-customization') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
